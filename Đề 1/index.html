<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hệ thống Quản lý Nhân sự</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Thanh điều hướng -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="#">NTD Car</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Nhân viên</a></li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Tìm kiếm nhân viên..." />
          <button class="btn btn-outline-warning" type="submit">Tìm</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Nội dung chính -->
  <div class="container mt-4">
    <div class="bg-dark text-white p-3 d-flex justify-content-between align-items-center rounded-top">
      <h4 class="mb-0"><strong>Quản lý nhân viên</strong></h4>
      <div>
        <button class="btn btn-outline-light me-2"><i class="fas fa-trash"></i> Xóa chọn</button>
        <button class="btn btn-warning text-dark" data-bs-toggle="modal" data-bs-target="#addModal">
          <i class="fas fa-user-plus"></i> Thêm nhân viên
        </button>
      </div>
    </div>

    <div class="table-responsive border border-top-0 rounded-bottom">
      <table class="table table-hover mb-0">
<thead class="table-light text-center align-middle">
  <tr>
    <th class="text-center" style="width: 50px;"><input type="checkbox" /></th>
    <th class="text-start" style="width: 20%;">Họ tên</th>
    <th class="text-start" style="width: 25%;">Email</th>
    <th class="text-start" style="width: 25%;">Địa chỉ</th>
    <th class="text-center" style="width: 120px;">SĐT</th>
    <th class="text-center" style="width: 120px;">Thao tác</th>
  </tr>
</thead>


        <tbody id="employeeTableBody"></tbody>
      </table>
    </div>

    <!-- Phân trang -->
    <div class="d-flex justify-content-between align-items-center mt-3">
      <p class="mb-0">Hiển thị 5 / 20 nhân viên</p>
      <nav>
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item"><a class="page-link" href="#">Trước</a></li>
          <li class="page-item"><a class="page-link" href="#">1</a></li>
          <li class="page-item active"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
          <li class="page-item"><a class="page-link" href="#">Tiếp</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- Modal Thêm nhân viên -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="employeeForm">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title">Thêm nhân viên mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input type="text" class="form-control" id="name" />
            <div class="text-danger small" id="nameError"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" />
            <div class="text-danger small" id="emailError"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <input type="text" class="form-control" id="address" />
          </div>
          <div class="mb-3">
            <label class="form-label">SĐT</label>
            <input type="text" class="form-control" id="phone" />
            <div class="text-danger small" id="phoneError"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-warning text-dark" type="submit">Lưu thông tin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
