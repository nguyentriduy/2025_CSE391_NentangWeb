<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý nhân viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark text-white px-4">
    <span class="navbar-brand">Trường Đại học Thủy lợi</span>
    <div>
      <a class="text-white me-3" href="#">Trang chủ</a>
      <a class="text-white me-3" href="#">Quản lý cửa hàng</a>
      <input type="text" placeholder="Tìm kiếm..." class="form-control d-inline w-auto me-2">
      <button class="btn btn-success">Tìm kiếm</button>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Hàng chứa Thêm, Xuất và Tìm kiếm + Lọc -->
    <div class="row mb-3 align-items-center">
      <div class="col-md-4 d-flex gap-2">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">Thêm</button>
        <button class="btn btn-success" id="exportBtn">Xuất ra file</button>
      </div>
      <div class="col-md-5 d-flex align-items-center">
        <input type="text" id="searchInput" class="form-control me-2" placeholder="Tìm kiếm theo Tên">
        <button class="btn btn-outline-secondary">🔍</button>
      </div>
      <div class="col-md-3">
        <div class="d-flex align-items-center">
          <label for="resultCount" class="me-2 mb-0">Kết quả</label>
          <select id="resultCount" class="form-select w-auto">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table class="table table-bordered text-center">
        <thead class="table-dark">
          <tr>
            <th><input type="checkbox" id="selectAll"></th>
            <th>Họ đệm</th>
            <th>Tên</th>
            <th>Địa chỉ</th>
            <th>Hoạt động</th>
          </tr>
        </thead>
        <tbody id="dataTable"></tbody>
      </table>

      <div class="d-flex justify-content-left">
        <button class="btn btn-danger" id="deleteSelected">Xóa các dòng đã chọn</button>
      </div>
    </div>
  </div>

  <footer class="footer bg-primary text-white py-3 mt-auto">
    <p>TRƯỜNG ĐẠI HỌC THỦY LỢI<br>
    175 Tây Sơn, Đống Đa, Hà Nội<br>
    Điện thoại: (024) 38522201<br>
    Email: phonghcth@tlu.edu.vn</p>
  </footer>

  <!-- Modal Thêm -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content p-3" id="addForm">
        <h5 class="modal-title mb-3">Thêm Nhân viên</h5>
        <input class="form-control mb-2" id="hoDem" placeholder="Họ đệm">
        <div id="errorHoDem" class="text-danger small mb-2"></div>
        <input class="form-control mb-2" id="ten" placeholder="Tên">
        <div id="errorTen" class="text-danger small mb-2"></div>
        <input class="form-control mb-2" id="diaChi" placeholder="Địa chỉ">
        <div id="errorDiaChi" class="text-danger small mb-2"></div>
        <div class="d-flex justify-content-end mt-3">
          <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-success">Thêm</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
