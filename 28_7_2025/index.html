<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý sinh viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Quản lý sinh viên</a>
    </div>
  </nav>

  <div class="content">
    <div class="form-section">
      <h5 class="card-title text-nowrap">Thêm sinh viên</h5>
      <form id="formSinhVien">
        <div class="mb-3">
          <label for="StudentID" class="form-label">Mã sinh viên:</label>
          <input type="text" class="form-control" id="StudentID" required/>
        </div>
        <div class="mb-3">
          <label for="StudentName" class="form-label">Họ và tên:</label>
          <input type="text" class="form-control" id="StudentName" required/>
        </div>
        <div class="mb-3">
          <label for="StudentEmail" class="form-label">Email:</label>
          <input type="email" class="form-control" id="StudentEmail" required/>
        </div>
        <div class="mb-3">
          <label for="StudentDoB" class="form-label">Ngày sinh:</label>
          <input type="date" class="form-control" id="StudentDoB"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Giới tính:</label>
          <div class="gender-options">
            <div class="gender-option"><span>Nam</span><input type="radio" name="StudentGender" value="Nam" class="form-check-input" required/></div>
            <div class="gender-option"><span>Nữ</span><input type="radio" name="StudentGender" value="Nữ" class="form-check-input"/></div>
          </div>
        </div>
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary" id="btnThem">Thêm sinh viên</button>
        </div>
      </form>
    </div>

    <div class="table-section">
      <h5 class="card-title">Danh sách sinh viên</h5>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>STT</th>
            <th>Mã sinh viên</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Giới tính</th>
            <th>Ngày sinh</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>SV001</td>
            <td>Nguyễn Trí Duy</td>
            <td>nguyenduy@gmail.com</td>
            <td>Nam</td>
            <td>25/01/2004</td>
            <td>
              <button class="btn btn-sm btn-warning me-1">Sửa</button>
              <button class="btn btn-sm btn-danger">Xoá</button>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>SV002</td>
            <td>Trần Thị Vân</td>
            <td>tranvan@gmail.com</td>
            <td>Nữ</td>
            <td>25/05/2004</td>
            <td>
              <button class="btn btn-sm btn-warning me-1">Sửa</button>
              <button class="btn btn-sm btn-danger">Xoá</button>
            </td>
          </tr>
          <tr>
            <td>3</td>
            <td>SV003</td>
            <td>Lê Văn Quang</td>
            <td>lequang@gmail.com</td>
            <td>Nam</td>
            <td>10/12/2004</td>
            <td>
              <button class="btn btn-sm btn-warning me-1">Sửa</button>
              <button class="btn btn-sm btn-danger">Xoá</button>
            </td>
          </tr>
        </tbody>
      </table>
      <div id="thongBao" class="mt-3 text-success fw-bold text-center"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
